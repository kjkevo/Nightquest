<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" id="theme-color-meta" />

    <!-- Primary meta -->
    <title>NightQuest — Conquer the Night</title>
    <meta name="description" content="RPG-style nightlife adventures for your squad. Discover venues, complete quests, earn XP, and plan the perfect night out — no account required." />
    <meta name="keywords" content="nightlife, nightout, squad, venues, RPG, quests, bar, club, college, going out" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://nightquest-one.vercel.app/" />
    <meta property="og:title"       content="NightQuest — Conquer the Night" />
    <meta property="og:description" content="RPG-style nightlife adventures for your squad. Discover venues, complete quests, earn XP, and plan the perfect night out — no account required." />
    <meta property="og:image"       content="https://nightquest-one.vercel.app/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="NightQuest — Conquer the Night" />
    <meta name="twitter:description" content="RPG-style nightlife adventures for your squad. Discover venues, complete quests, earn XP — no account required." />
    <meta name="twitter:image"       content="https://nightquest-one.vercel.app/og-image.png" />

    <!-- PWA / Apple -->
    <meta name="apple-mobile-web-app-capable"            content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style"   content="black-translucent" />
    <meta name="apple-mobile-web-app-title"              content="NightQuest" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

    <!-- Loading splash styles -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      #nq-splash {
        position: fixed; inset: 0;
        background: #0a0a0f;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 1rem; padding: 2rem;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #nq-splash.fade-out { opacity: 0; pointer-events: none; }

      .nq-splash-sword {
        font-size: 3.5rem;
        animation: nq-pulse 1.8s ease-in-out infinite;
        margin-bottom: 0.25rem;
      }
      .nq-splash-title {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 1.6rem; font-weight: 900;
        letter-spacing: 0.15em; text-transform: uppercase;
        color: #f0c060;
      }
      .nq-splash-tagline {
        font-family: Georgia, serif;
        font-size: 0.8rem; letter-spacing: 0.2em;
        text-transform: uppercase; color: #6b7280;
        margin-bottom: 0.5rem;
      }
      .nq-splash-features {
        display: flex; flex-direction: column; gap: 0.3rem;
        margin-bottom: 0.75rem;
      }
      .nq-splash-feature {
        font-family: Georgia, serif; font-size: 0.8rem;
        color: #9ca3af; display: flex; align-items: center; gap: 0.5rem;
      }
      .nq-splash-feature span { color: #f0c060; font-size: 0.7rem; }
      .nq-cta {
        display: inline-block;
        padding: 0.75rem 2.25rem;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: #fff;
        font-family: 'Cinzel', Georgia, serif;
        font-size: 0.85rem; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase;
        text-decoration: none;
        box-shadow: 0 0 24px rgba(124,58,237,0.5);
        transition: opacity 0.2s;
        cursor: pointer; border: none;
      }
      .nq-cta:hover { opacity: 0.85; }
      .nq-badge {
        font-family: Georgia, serif; font-size: 0.65rem;
        color: #22c55e; border: 1px solid #166534;
        padding: 0.2rem 0.75rem; border-radius: 999px;
        letter-spacing: 0.15em; text-transform: uppercase;
        margin-top: 0.25rem;
      }
      .nq-spinner {
        width: 22px; height: 22px;
        border: 2px solid #1f1f2e;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: nq-spin 0.8s linear infinite;
        margin-top: 0.5rem;
      }
      @keyframes nq-spin  { to { transform: rotate(360deg); } }
      @keyframes nq-pulse {
        0%, 100% { transform: scale(1);   opacity: 1;   }
        50%       { transform: scale(1.12); opacity: 0.75; }
      }
    </style>
  </head>
  <body style="background:#0a0a0f; color:#e5e7eb; margin:0;">

    <!-- Loading splash with CTA — fades out once React mounts -->
    <div id="nq-splash" role="main" aria-label="NightQuest loading">
      <div class="nq-splash-sword">⚔️</div>
      <div class="nq-splash-title">NightQuest</div>
      <div class="nq-splash-tagline">Conquer the Night</div>
      <div class="nq-splash-features">
        <div class="nq-splash-feature"><span>⚡</span> 7,500+ quests across 5 venue types</div>
        <div class="nq-splash-feature"><span>🗺️</span> Discover 20 venues near your campus</div>
        <div class="nq-splash-feature"><span>👥</span> Plan &amp; track the night with your squad</div>
      </div>
      <a class="nq-cta" href="/?tab=quests">Play Now — Free</a>
      <div class="nq-badge">No Account · No Signup · Your Data Only</div>
      <div class="nq-spinner"></div>
    </div>

    <div id="root"></div>

    <!-- No-JS fallback -->
    <noscript>
      <style>
        #nq-splash { display: none !important; }
        .nq-noscript {
          min-height: 100vh; background: #0a0a0f; color: #e5e7eb;
          font-family: Georgia, serif;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          text-align: center; padding: 2rem; gap: 1rem;
        }
        .nq-noscript h1 {
          font-size: 1.6rem; font-weight: 900;
          letter-spacing: 0.2em; text-transform: uppercase; color: #f0c060;
          font-family: 'Cinzel', Georgia, serif;
        }
        .nq-noscript .tagline { color: #6b7280; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; }
        .nq-noscript p { color: #9ca3af; max-width: 320px; line-height: 1.7; margin: 0; }
        .nq-noscript ul { color: #d1d5db; list-style: none; line-height: 2.2; padding: 0; text-align: left; }
        .nq-noscript ul li::before { content: "⚔️  "; }
        .nq-noscript .cta-note {
          margin-top: 1.5rem; padding: 0.75rem 1.5rem;
          border: 1px solid #374151; border-radius: 0.75rem;
          color: #6b7280; font-size: 0.8rem; max-width: 280px; line-height: 1.5;
        }
      </style>
      <div class="nq-noscript">
        <div style="font-size:3.5rem">⚔️</div>
        <h1>NightQuest</h1>
        <div class="tagline">Conquer the Night</div>
        <p>RPG-style nightlife adventures for your squad.</p>
        <ul>
          <li>7,500+ quests across 5 venue types</li>
          <li>Discover 20 venues near your campus</li>
          <li>Plan &amp; track the night with your squad</li>
          <li>Earn XP, level up, unlock perks</li>
          <li>No account required — your data only</li>
        </ul>
        <div class="cta-note">
          JavaScript is required to play NightQuest.<br/>
          Please enable it in your browser settings.
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Dismiss loading splash once React has painted -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var splash = document.getElementById('nq-splash');
        if (!splash) return;
        var obs = new MutationObserver(function () {
          if (document.getElementById('root').childElementCount > 0) {
            obs.disconnect();
            splash.classList.add('fade-out');
            setTimeout(function () { splash.remove(); }, 450);
          }
        });
        obs.observe(document.getElementById('root'), { childList: true });
        // Hard fallback — remove splash after 6s
        setTimeout(function () {
          splash.classList.add('fade-out');
          setTimeout(function () { splash.remove(); }, 450);
        }, 6000);
      });
    </script>
  </body>
</html>
